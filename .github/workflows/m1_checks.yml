# M1 desktop checks: static + desktop (panel/plasmoid/package/naming/inert-state),
# the native apt pin-identity suite (F6), the cham3-desktop/cham3-full package
# build, and the privileged dumpcap capture suite (F3/F8). Uses no secrets and no
# production credentials. The heavy M1 gates (real desktop ISO build, graphical
# Plasma 6 Wayland boot, disk install, installed-system boot and the native F2
# source gates) are in m1_image.yml, started by hand. Results from these jobs are
# development evidence only and prove no M2-M4 security enforcement.
name: m1_checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CHAM3_OUT_DIR: ${{ github.workspace }}/out
  CHAM3_REPO_ROOT: ${{ github.workspace }}
  DEBIAN_FRONTEND: noninteractive

jobs:
  static_and_desktop:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build host packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends $(grep -v '^#' build/host_packages.txt) desktop-file-utils
      # Non-root user so root-sensitive M0 static tests run rather than skip.
      - name: Create unprivileged user
        run: |
          useradd --create-home --uid 1000 builder
          chown -R builder: "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Static checks
        env:
          HOME: /home/builder
        run: runuser -u builder -- build/scripts/run_static_checks.sh
      - name: Static check tests
        env:
          HOME: /home/builder
        run: runuser -u builder -- tests/run_tests.sh static
      - name: Desktop (M1) static tests
        env:
          HOME: /home/builder
        run: runuser -u builder -- tests/run_tests.sh desktop
      - name: Staging (F1 per-profile package selection) tests
        env:
          HOME: /home/builder
        # Docker-free: exercises build_image.sh CHAM3_STAGE_DRYRUN against fixture
        # debs, unprivileged (the dry-run exits before the root check).
        run: runuser -u builder -- tests/run_tests.sh staging
      - name: Native apt pin identity tests (F6)
        env:
          HOME: /home/builder
        # Real apt-get/apt-cache against signed synthetic repositories served by a
        # local proxy; no network, no root.
        run: runuser -u builder -- tests/run_tests.sh apt

  package_build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build host packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends $(grep -v '^#' build/host_packages.txt) desktop-file-utils
      - name: Build packages (cham3-base, cham3-desktop, cham3-full) and run lintian
        run: build/scripts/build_packages.sh
      - name: Package tests
        run: tests/run_tests.sh packages
      - name: Upload package results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: m1_packages
          path: out/packages
          retention-days: 7

  privileged_capture:
    runs-on: ubuntu-latest
    # SECURITY: "--privileged" below is acceptable only on GitHub-hosted ephemeral
    # runners. Do not move this job to self-hosted runners without a security review.
    # The suite changes users, groups and /usr/bin/dumpcap inside this disposable
    # container. CHAM3_REQUIRE_PRIVILEGED_CAPTURE=1 turns any missing capture
    # capability into a failure: no member/nonmember capture check may be skipped (F8).
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build host packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends $(grep -v '^#' build/host_packages.txt) desktop-file-utils
      - name: Build packages
        run: build/scripts/build_packages.sh
      - name: Privileged capture and maintainer-script suites (F3, F8)
        env:
          CHAM3_REQUIRE_PRIVILEGED_CAPTURE: "1"
        run: |
          mkdir -p out/evidence
          set -o pipefail
          sh tests/container/in_container.sh 2>&1 | tee out/evidence/privileged_container.log
        shell: bash
      - name: Upload privileged suite log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: m1_privileged_capture
          path: out/evidence
          retention-days: 14
