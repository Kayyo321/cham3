# M2 Rust qualification and test suites on GitHub-hosted amd64 runners.
#
# Builds the pinned Debian 13 container (build/m2/dev_container.dockerfile, base
# image pinned by digest, exact package versions) and runs, unprivileged inside it:
# build/scripts/qualify_m2_rust.sh --record (toolchain/package pins and locks, crate
# source manifest, dependency inventory, rustfmt/clippy/naming, debug and release
# builds, backend selection, valgrind of the probe and of the secure-memory tests,
# unit and harness suites) with CHAM3_M2_REQUIRE_CLEAN=1, so source identity must be
# complete and clean; then the vault process-protection positive path with a raised
# memlock limit (tests/m2/protection/check_vault_protection.sh). --record only writes lock proposals when the observed package
# set differs from the committed amd64 locks; the run then FAILs.
# No secrets, no production keys, read-only repository permissions. Results are
# development evidence for the exact commit only and establish no M3-M6 enforcement.
name: m2_checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify_amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: Build pinned Debian 13 qualification container
        run: docker build -f build/m2/dev_container.dockerfile -t cham3-m2-dev build/m2
      - name: Qualify M2 Rust toolchain and run M2 suites (unprivileged)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/cham3_home \
            -e CHAM3_M2_REQUIRE_CLEAN=1 \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/work \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            cham3-m2-dev \
            bash build/scripts/qualify_m2_rust.sh --record
      # The qualification container's 8 MiB memlock limit cannot hold the vault's
      # locked KDF budget, so the positive path of the vault's process protection
      # (ADR 0005 section 5) runs here with the limit its systemd unit will set; the
      # refusal path with the small limit is in the harness suite above.
      - name: Vault process protection, positive path (memlock limit raised, unprivileged)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --ulimit memlock=1073741824:1073741824 \
            -e HOME=/tmp/cham3_home \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            cham3-m2-dev \
            sh tests/m2/protection/check_vault_protection.sh out/m2/protection
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: m2_qualification_amd64
          # Text evidence only; build targets are excluded (the revision-1 artifact
          # included them and was 167 MB).
          path: |
            out/m2/qualification/*/*.txt
            out/m2/qualification/*/*.log
            out/m2/qualification/*/*.json
            out/m2/qualification/*/*.md
            out/m2/qualification/*/*.sha256
            out/m2/runs/*/*.txt
            out/m2/runs/*/*.json
            out/m2/runs/*/*.log
            out/m2/protection/*.txt
          retention-days: 14
          if-no-files-found: error
