# M1 heavy gates on a declared disposable native x86-64 Debian 13 environment.
#
# Environment: GitHub-hosted ubuntu-latest runners (ephemeral x86-64 VMs, discarded
# after the job); every gate runs inside a debian:trixie (Debian 13) container, the
# image and VM jobs as --privileged containers started by the job (live-build needs
# chroot and mount access; QEMU uses /dev/kvm when the runner offers it, else TCG).
# Network: the runner's ordinary outbound access. It reaches the official Debian
# mirrors, http.kali.org and the Kali mirrors it redirects to, and repo.librewolf.net
# over verified TLS; no proxy or CA is injected, TLS and apt signature checks stay
# enabled, and nothing is marked trusted. No secrets or production credentials.
#
# Jobs: f2_native (real-archive signatures, exhaustive pin policy, closure by download
# host, controls, real install + upgrade), m1_iso (packages, M1 ISO, image-m1 with the
# ISO pool / installer payload audit) and m1_vm (live graphical session, disk install,
# installed system). They take hours, so they run on pushes to the M1 task branch that
# change more than documentation, and by hand (workflow_dispatch, once this file is on
# the default branch). A push to a scratch branch ci/m1-vm-* runs only the VM job
# against the ISO of an earlier run named in .github/m1_reuse_iso_run_id on that branch
# (harness iteration without rebuilding the ISO; never the evidence for a target).
# Results are development evidence only and prove no M2-M4 security enforcement.
name: m1_image

on:
  push:
    branches:
      - task/M1-bootable-desktop
      - "ci/m1-vm-*"
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
    inputs:
      reuse_iso_run_id:
        description: "Earlier m1_image run ID whose m1_iso artifact the VM job uses (empty: build here)"
        required: false
        default: ""
      vm_phases:
        description: "VM phases (space separated): live install installed"
        required: false
        default: "live install installed"

permissions:
  contents: read
  actions: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      reuse_iso_run_id: ${{ steps.plan.outputs.reuse_iso_run_id }}
      vm_phases: ${{ steps.plan.outputs.vm_phases }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: Decide whether this run builds the ISO or reuses one
        id: plan
        env:
          INPUT_REUSE: ${{ inputs.reuse_iso_run_id }}
          INPUT_PHASES: ${{ inputs.vm_phases }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          reuse="${INPUT_REUSE:-}"
          phases="${INPUT_PHASES:-live install installed}"
          case "${REF_NAME}" in
            ci/m1-vm-*)
              reuse=$(tr -cd '0-9' < .github/m1_reuse_iso_run_id)
              [ -n "${reuse}" ] || { echo "ci/m1-vm-* needs .github/m1_reuse_iso_run_id" >&2; exit 1; }
              if [ -f .github/m1_vm_phases ]; then
                phases=$(tr -cd 'a-z ' < .github/m1_vm_phases)
              fi
              ;;
          esac
          echo "vm_phases=${phases}" >> "$GITHUB_OUTPUT"
          case "${reuse}" in
            '' | *[!0-9]*) [ -z "${reuse}" ] || { echo "invalid run id: ${reuse}" >&2; exit 1; } ;;
          esac
          echo "reuse_iso_run_id=${reuse}" >> "$GITHUB_OUTPUT"
          echo "reuse_iso_run_id=${reuse:-<build in this run>}"

  f2_native:
    needs: [plan]
    if: ${{ needs.plan.outputs.reuse_iso_run_id == '' }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build host packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends $(grep -v '^#' build/host_packages.txt) desktop-file-utils
      - name: Build packages
        run: build/scripts/build_packages.sh
      - name: Native F2 source gates
        shell: bash
        run: |
          mkdir -p out/f2_native
          git rev-parse HEAD > out/f2_native/commit.txt
          set -o pipefail
          python3 tests/native/f2_source_gates.py --repo . --packages out/packages --out out/f2_native \
            2>&1 | tee out/f2_native/console.log
      - name: Upload F2 evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: m1_f2_native
          path: out/f2_native
          retention-days: 30

  m1_iso:
    needs: [plan]
    if: ${{ needs.plan.outputs.reuse_iso_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: Free runner disk space for the image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /
      # SECURITY: --privileged is acceptable only on GitHub-hosted ephemeral runners.
      # Do not move this job to self-hosted runners without a security review.
      - name: Build the M1 ISO and run image-m1 (privileged Debian 13 container)
        run: >-
          docker run --rm --privileged
          --volume "$GITHUB_WORKSPACE:/work" --workdir /work
          debian:trixie bash build/scripts/ci_m1_heavy.sh iso
      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: m1_iso
          path: out/image/cham3-m1-desktop-amd64.iso
          compression-level: 0
          retention-days: 14
      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: m1_iso_evidence
          path: |
            out/evidence/iso
            out/image/build.log
            out/image/provenance.json
            out/image/SHA256SUMS
            out/image/cham3-m1-desktop-amd64.packages
          retention-days: 30

  m1_vm:
    needs: [plan, m1_iso]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && (needs.m1_iso.result == 'success' || needs.plan.outputs.reuse_iso_run_id != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: Free runner disk space for the VM disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /
      - name: Allow KVM for the container when the runner offers it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-cham3-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
            echo "CHAM3_KVM_DEVICE=--device=/dev/kvm" >> "$GITHUB_ENV"
          else
            echo "no /dev/kvm on this runner: QEMU uses TCG"
          fi
      - name: Download the ISO built in this run
        if: ${{ needs.plan.outputs.reuse_iso_run_id == '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: m1_iso
          path: out/image
      - name: Download the ISO of an earlier run
        if: ${{ needs.plan.outputs.reuse_iso_run_id != '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: m1_iso
          path: out/image
          run-id: ${{ needs.plan.outputs.reuse_iso_run_id }}
          github-token: ${{ github.token }}
      # SECURITY: --privileged is acceptable only on GitHub-hosted ephemeral runners.
      - name: VM gates (privileged Debian 13 container)
        env:
          CHAM3_VM_PHASES: ${{ needs.plan.outputs.vm_phases }}
        run: >-
          docker run --rm --privileged ${CHAM3_KVM_DEVICE:-}
          --env CHAM3_VM_PHASES
          --volume "$GITHUB_WORKSPACE:/work" --workdir /work
          debian:trixie bash build/scripts/ci_m1_heavy.sh vm
      - name: Upload VM evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: m1_vm_evidence
          path: out/vm
          retention-days: 30
