<title id="logo_title">Cham3</title>
<desc id="logo_description">Three closely overlapping chameleons turn progressively right. A faceted rose chameleon is in front of purple and pale grey silhouettes. Only the foreground spiral tail is visible. Cham3 wordmark underneath.</desc>
