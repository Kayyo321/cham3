[package]
name = "cham3_registryd"
description = "Eternal Contract Repository: immutable signed DAG, admission, indexes, lifecycle and recovery (cham3-registryd)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# No doctests: every executed suite must contain real tests (tests/m2/run_m2_tests.sh
# rejects zero-test suites).
[lib]
doctest = false

# Restrictive-reserve probe for tests/m2/storage/check_reserve_full_disk.sh and
# tests/m2/harness/test_m2_reserve_probe.py (M2-005 review R03). A qualification tool
# only, never packaged; exercised as a subprocess.
[[bin]]
name = "cham3_reserve_probe"
path = "src/bin/cham3_reserve_probe.rs"
test = false

[dependencies]
cham3_contract_format = { path = "../contract_format" }
cham3_identityd = { path = "../identityd" }
cham3_os_adapter = { path = "../native/os_adapter" }

[dev-dependencies]
ed25519-dalek = { workspace = true }
