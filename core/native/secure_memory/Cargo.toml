[package]
name = "cham3_secure_memory"
description = "Guarded, locked, non-dumpable memory regions for cham3 secret material (reviewed unsafe adapter)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Native adapter: unsafe code is permitted here and only here. It must stay small,
# documented and independently reviewed (docs/decisions/0003_m2_rust_toolchain_dependencies.md).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
non_camel_case_types = "allow"
non_upper_case_globals = "allow"
non_snake_case = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"

# No doctests: every executed suite must contain real tests (tests/m2/run_m2_tests.sh
# rejects zero-test suites).
[lib]
doctest = false

[dependencies]
rustix = { workspace = true }
zeroize = { workspace = true }
