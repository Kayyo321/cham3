[package]
name = "cham3_contractd"
description = "Contract proposals, canonical encoding, signature verification and revisions (cham3-contractd)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# No doctests: every executed suite must contain real tests (tests/m2/run_m2_tests.sh
# rejects zero-test suites).
[lib]
doctest = false

[dependencies]
cham3_contract_format = { path = "../contract_format" }
cham3_identityd = { path = "../identityd" }
cham3_registryd = { path = "../registryd" }

[dev-dependencies]
ed25519-dalek = { workspace = true }
