[package]
name = "cham3_contract_format"
description = "Canonical cham3 contract schema, deterministic CBOR profile and COSE_Sign1 envelope handling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# No doctests: every executed suite must contain real tests (tests/m2/run_m2_tests.sh
# rejects zero-test suites).
[lib]
doctest = false

[dependencies]
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }

# Differential probe for tests/m2/lib/m2_harness.py (format-differential); its
# behavior is exercised as a subprocess, so it has no unit tests of its own.
[[bin]]
name = "cham3_format_probe"
path = "src/bin/cham3_format_probe.rs"
test = false
