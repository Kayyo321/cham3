[package]
name = "cham3_identityd"
description = "Per-user identity registry: authenticated signing keys, authority classes, certificates and key epochs (cham3-identityd)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# No doctests: every executed suite must contain real tests (tests/m2/run_m2_tests.sh
# rejects zero-test suites).
[lib]
doctest = false

[dependencies]
cham3_contract_format = { path = "../contract_format" }
cham3_os_adapter = { path = "../native/os_adapter" }

[dev-dependencies]
ed25519-dalek = { workspace = true }
