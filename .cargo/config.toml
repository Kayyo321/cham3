# cham3 M2 Cargo configuration (PROPOSED G1, docs/decisions/0003_m2_rust_toolchain_dependencies.md).
#
# Dependency sources come only from Debian 13 librust-*-dev packages installed under
# /usr/share/cargo/registry (authenticated by APT). crates.io is never contacted.
# Debian's registry entries carry a placeholder package checksum, so per-file source
# digests are pinned separately in build/m2/crate_sources.sha256 and checked by
# build/scripts/qualify_m2_rust.sh.
[source.crates-io]
replace-with = "debian_registry"

[source.debian_registry]
directory = "/usr/share/cargo/registry"

[net]
offline = true

[build]
# Backend selection (PROPOSED G1) to minimize audited unsafe code; performance is not
# a constraint at M2's data volumes:
# * curve25519-dalek: formally verified fiat-crypto field arithmetic, no SIMD
#   intrinsics and no curve25519-dalek-derive procedural macro;
# * chacha20 and poly1305: portable software backends (no SSE2/AVX2/NEON paths).
# sha2 uses its "force-soft" feature (Cargo.toml). Do not override with RUSTFLAGS;
# build/scripts/qualify_m2_rust.sh verifies these flags reach each crate.
rustflags = [
    "--cfg", "curve25519_dalek_backend=\"fiat\"",
    "--cfg", "chacha20_force_soft",
    "--cfg", "poly1305_force_soft",
]

[term]
color = "never"
